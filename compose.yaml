services:
  ai-town:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: ${PORT:-3001}
      PERSIST_WORLD: ${PERSIST_WORLD:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
    volumes:
      - town-data:/app/.data

volumes:
  town-data:
